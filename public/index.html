<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #090a0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #13151c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #6c5ce7, #00d4ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 28px;
      color: #fff;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    p { color: #9497a3; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #a1a5b5; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      background: #090a0f;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #6c5ce7; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6c5ce7, #4834d4);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .status { margin-top: 14px; font-size: 12px; color: #00d4ff; display: none; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      margin: 12px auto 0;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AI</div>
    <h1>Nexus AI Agent</h1>
    <p>Connect your mobile app to your AI server backend to start research, image & video generation.</p>
    
    <div class="input-group">
      <label for="serverUrl">Server Endpoint URL</label>
      <input type="text" id="serverUrl" placeholder="https://your-app.vercel.app or http://192.168.1.5:3000" />
    </div>

    <button class="btn" onclick="connectServer()">Connect & Open App</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Connecting...</div>
  </div>

  <script>
    const savedUrl = localStorage.getItem('NEXUS_SERVER_URL');
    const input = document.getElementById('serverUrl');
    if (savedUrl) {
      input.value = savedUrl;
      if (savedUrl.startsWith('http://') || savedUrl.startsWith('https://')) {
        showLoading('Loading server...');
        setTimeout(() => { window.location.href = savedUrl; }, 400);
      }
    } else {
      input.value = 'http://192.168.1.101:3000';
    }

    function showLoading(msg) {
      document.getElementById('spinner').style.display = 'block';
      const st = document.getElementById('status');
      st.innerText = msg;
      st.style.display = 'block';
    }

    function connectServer() {
      let url = input.value.trim();
      if (!url) {
        alert('Please enter your Server Endpoint URL');
        return;
      }
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      localStorage.setItem('NEXUS_SERVER_URL', url);
      showLoading('Opening ' + url + '...');
      setTimeout(() => {
        window.location.href = url;
      }, 300);
    }
  </script>
</body>
</html>
